<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Sinfonía Guatemalteca</title>
  <link rel="stylesheet" href="CSS/common.css">
  <link rel="stylesheet" href="CSS/cart.css">
</head>
<body>

  <main class="container cart-container">

    <a class="btn btn-secondary back-link" href="events.html">Volver a eventos</a>

    <section class="card">
      <div class="cart-header">
        <h2>Tu Carrito</h2>
        <p id="itemCount" class="cart-header__count"></p>
      </div>

      <div id="cartItems"></div>

      <div id="emptyCart" class="hidden empty-cart">
        <p>Tu carrito está vacío</p>
        <a class="btn btn-primary" href="events.html">Explorar Eventos</a>
      </div>

      <div id="cartSummary" class="hidden cart-summary">
        <div class="cart-summary__row">
          <span class="cart-summary__label">Total a pagar:</span>
          <span id="cartTotal" class="cart-summary__total">Q0.00</span>
        </div>
        <button type="button" id="checkoutBtn" class="btn btn-primary btn-block">Proceder al Pago</button>
      </div>
    </section>
  </main>

  <div id="paymentModal" class="payment-modal" role="dialog" aria-modal="true" aria-labelledby="paymentTitle">
    <div class="payment-content">
      <h2 id="paymentTitle" class="payment-title">Finalizar Compra</h2>
      <p class="payment-note">Pago simulado: los datos de la tarjeta se validan pero nunca se guardan.</p>

      <form id="paymentForm" novalidate>
        <div class="form-grid">
          <div class="full-width">
            <label for="cardName">Nombre en la tarjeta</label>
            <input type="text" id="cardName" name="cardName" class="input" autocomplete="cc-name" required>
          </div>
          <div class="full-width">
            <label for="cardNumber">Número de tarjeta</label>
            <input type="text" id="cardNumber" name="cardNumber" class="input" inputmode="numeric"
                   autocomplete="cc-number" maxlength="23" placeholder="0000 0000 0000 0000" required>
          </div>
          <div>
            <label for="cardExpiry">Vencimiento (MM/AA)</label>
            <input type="text" id="cardExpiry" name="cardExpiry" class="input" inputmode="numeric"
                   autocomplete="cc-exp" maxlength="5" placeholder="MM/AA" required>
          </div>
          <div>
            <label for="cardCvv">CVV</label>
            <input type="password" id="cardCvv" name="cardCvv" class="input" inputmode="numeric"
                   autocomplete="cc-csc" maxlength="4" required>
          </div>
          <div>
            <label for="userDoc">DPI / NIT</label>
            <input type="text" id="userDoc" name="userDoc" class="input" required>
          </div>
          <div>
            <label for="userPhone">Teléfono</label>
            <input type="tel" id="userPhone" name="userPhone" class="input" inputmode="numeric"
                   autocomplete="tel" placeholder="5555 5555" required>
          </div>
          <div class="full-width">
            <label for="userEmail">Correo electrónico</label>
            <input type="email" id="userEmail" name="userEmail" class="input" autocomplete="email" required>
          </div>
        </div>

        <p id="paymentError" class="form-error hidden payment-error" role="alert"></p>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary modal-actions__main">Confirmar Pago</button>
          <button type="button" id="cancelPaymentBtn" class="btn btn-secondary modal-actions__secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="JS/utils.js" defer></script>
  <script src="JS/store.js" defer></script>
  <script src="JS/cart.js" defer></script>
</body>
</html>
