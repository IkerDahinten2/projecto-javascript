<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - Sinfonía Guatemalteca</title>
  <link rel="stylesheet" href="CSS/common.css">
  <link rel="stylesheet" href="CSS/events.css">
</head>
<body class="events-page">

  <header class="header">
    <div class="container header-content">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <h1>Sinfonía Guatemalteca</h1>
      </div>
      <nav class="header-actions" aria-label="Acciones de usuario">
        <div class="user-info">
          <span id="userName">Usuario</span>
          <span id="userBadge"></span>
        </div>
        <a id="adminBtn" class="btn btn-secondary hidden" href="admin.html">Panel Admin</a>
        <a class="btn btn-secondary" href="cart.html">🛒 Carrito (<span id="cartCount">0</span>)</a>
        <button type="button" id="logoutBtn" class="btn btn-secondary">Salir</button>
      </nav>
    </div>
  </header>

  <div class="filters">
    <div class="container">
      <div class="filters-grid">
        <div class="search-input">
          <label for="searchInput" class="visually-hidden">Buscar eventos</label>
          <input type="search" id="searchInput" class="input" placeholder="Buscar eventos...">
        </div>
        <label for="cityFilter" class="visually-hidden">Ciudad</label>
        <select id="cityFilter" class="select"></select>
        <label for="categoryFilter" class="visually-hidden">Categoría</label>
        <select id="categoryFilter" class="select"></select>
      </div>
    </div>
  </div>

  <main class="container">
    <p id="eventCount" class="event-count" aria-live="polite"></p>

    <div id="eventsGrid" class="events-grid"></div>

    <div id="noEvents" class="empty-state hidden">
      <p>No se encontraron eventos. Intenta cambiar los filtros.</p>
    </div>
  </main>

  <script src="JS/utils.js" defer></script>
  <script src="JS/store.js" defer></script>
  <script src="JS/events.js" defer></script>
</body>
</html>
